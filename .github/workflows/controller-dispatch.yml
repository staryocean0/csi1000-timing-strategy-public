name: CSI1000 bounded dispatch controller

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: read
  actions: write

concurrency:
  group: csi1000-dispatch-controller-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'staryocean0/csi1000-timing-strategy-public' &&
      github.event_name == 'issues' &&
      (github.event.action == 'opened' ||
       (github.event.action == 'reopened' &&
        ((github.event.issue.number == 227 &&
          github.event.issue.title == 'controller: two-wave-v0800-f-operational-state-stream-audit-v1') ||
         (github.event.issue.number == 307 &&
          github.event.issue.title == 'controller: two-wave-c3-router-v1') ||
         (github.event.issue.number == 312 &&
          github.event.issue.title == 'controller: two-wave-hierarchy-attrition-v1') ||
         (github.event.issue.number == 326 &&
          github.event.issue.title == 'controller: two-wave-blindspot-relocation-v1')))) &&
      github.event.issue.user.login == github.repository_owner &&
      (github.event.issue.title == 'controller: runtime-smoke' ||
       github.event.issue.title == 'controller: handoff-verify-v1' ||
       github.event.issue.title == 'controller: risk-v2-severity-persistence-v1' ||
       github.event.issue.title == 'controller: risk-v2-phase1b-ordering-calibration-v1' ||
       github.event.issue.title == 'controller: risk-v2-phase1b-carrier-inventory-v1' ||
       github.event.issue.title == 'controller: risk-v2-phase1b-fresh-oos-v1' ||
       github.event.issue.title == 'controller: risk-v2-phase1b-fresh-oos-attrition-v1' ||
       github.event.issue.title == 'controller: risk-v2-future-carrier-binding-audit-v1' ||
       github.event.issue.title == 'controller: risk-v3-native15-carrier-semantic-audit-v1' ||
       github.event.issue.title == 'controller: risk-v3-native15-descriptive-risk-map-v1' ||
       github.event.issue.title == 'controller: risk-v3-native15-state-machine-candidates-v1' ||
       github.event.issue.title == 'controller: risk-v3-native60-phase60a-canonical-carrier-v1' ||
       github.event.issue.title == 'controller: risk-v3-native60-phase60b-volatility-continuity-map-v1' ||
       github.event.issue.title == 'controller: risk-v3-native15-c1-gate-attribution-v1' ||
       github.event.issue.title == 'controller: risk-v2-historical-000852-2015-2019-v1' ||
       github.event.issue.title == 'controller: risk-v2-temporal-stability-2015-2025-v1' ||
       github.event.issue.title == 'controller: risk-v2-15m-annual-calibration-diagnostic-v1' ||
       github.event.issue.title == 'controller: risk-v2-15m-tail-robust-calibration-v2' ||
       github.event.issue.title == 'controller: risk-v2-weekly-support-diagnostic-v1' ||
       github.event.issue.title == 'controller: risk-v2-weekly-window-feasibility-v1' ||
       github.event.issue.title == 'controller: risk-v2-temporal-stability-2week-v2' ||
       github.event.issue.title == 'controller: risk-v2-weekly-ordering-diagnostic-v1' ||
       github.event.issue.title == 'controller: risk-v2-temporal-stability-v3-adjudication' ||
       github.event.issue.title == 'controller: risk-v2-weekly-calibration-streak-diagnostic-v1' ||
       github.event.issue.title == 'controller: risk-v2-15m-state-conditional-calibration-diagnostic-v1' ||
       github.event.issue.title == 'controller: risk-v2-15m-within-cell-drift-carrier-diagnostic-v1' ||
       github.event.issue.title == 'controller: risk-v2-15m-online-prior-calibration-v3' ||
       github.event.issue.title == 'controller: risk-v2-15m-hierarchical-prior-calibration-v4' ||
       github.event.issue.title == 'controller: risk-v2-15m-probability-validity-guard-v1' ||
       github.event.issue.title == 'controller: risk-v2-15m-continuous-reliability-score-v1' ||
       github.event.issue.title == 'controller: risk-v2-probability-reliability-output-contract-v1' ||
       github.event.issue.title == 'controller: risk-v2-probability-reliability-consumer-contract-v1' ||
       github.event.issue.title == 'controller: two-wave-v0800-duration-scale-map-v1' ||
       github.event.issue.title == 'controller: two-wave-v0800-b1-strict-continuity-v1' ||
       github.event.issue.title == 'controller: two-wave-v0800-c-causal-prefix-replay-v1' ||
       github.event.issue.title == 'controller: two-wave-v0800-d-direction-grid-v1' ||
       github.event.issue.title == 'controller: two-wave-v0800-e-morphology-visual-audit-v1' ||
       github.event.issue.title == 'controller: two-wave-v0800-f-operational-state-stream-audit-v1' ||
       github.event.issue.title == 'controller: two-wave-v0800-g-bar-time-carrier-semantics-v1' ||
       github.event.issue.title == 'controller: two-wave-dual-gates-v1' ||
       github.event.issue.title == 'controller: two-wave-multiscale-dual-gates-v2' ||
       github.event.issue.title == 'controller: two-wave-c3-router-v1' ||
       github.event.issue.title == 'controller: two-wave-hierarchy-attrition-v1' ||
       github.event.issue.title == 'controller: two-wave-cycle-identifiability-v1' ||
       github.event.issue.title == 'controller: two-wave-scale-specific-continuity-v1' ||
       github.event.issue.title == 'controller: two-wave-blindspot-relocation-v1' ||
       github.event.issue.title == 'controller: two-wave-recognizer-r1-progress-reset-v1' ||
       github.event.issue.title == 'controller: two-wave-r1-residual-clock-audit-v1' ||
       github.event.issue.title == 'controller: two-wave-recognizer-r2-eligible-counter-v1' ||
       github.event.issue.title == 'controller: two-wave-recognizer-r3-mature-counter-rearm-v1' ||
       github.event.issue.title == 'controller: overnight-carrier-materialization-v1' ||
       github.event.issue.title == 'controller: overnight-continuous-tail-likelihood-dev-v1' ||
       github.event.issue.title == 'controller: overnight-continuous-tail-likelihood-blackbox-v1' ||
       github.event.issue.title == 'controller: ols-drawdown-d0-v1' ||
       github.event.issue.title == 'controller: ols-r2-d1-leadlag-v1' ||
       github.event.issue.title == 'controller: ols-r2-d2-exit-overlay-v1' ||
       github.event.issue.title == 'controller: ols-maxdd-failure-atlas-v1' ||
       github.event.issue.title == 'controller: ols-maxdd-reentry-identification-v1' ||
       github.event.issue.title == 'controller: ols-maxdd-risk-state-overlap-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      REQUEST_TITLE: ${{ github.event.issue.title }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch approved standard profile
        shell: bash
        run: |
          set -euo pipefail
          case "$REQUEST_TITLE" in
            'controller: runtime-smoke')
              profile='runtime-smoke'
              ;;
            'controller: handoff-verify-v1')
              profile='handoff-verify-v1'
              ;;
            'controller: risk-v2-severity-persistence-v1')
              profile='risk-v2-severity-persistence-v1'
              ;;
            'controller: risk-v2-phase1b-ordering-calibration-v1')
