name: CSI1000 bounded dispatch controller

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read
  actions: write

concurrency:
  group: csi1000-dispatch-controller-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'staryocean0/csi1000-timing-strategy-public' &&
      github.event_name == 'issues' &&
      github.event.action == 'opened' &&
      github.event.issue.user.login == github.repository_owner &&
      (github.event.issue.title == 'controller: runtime-smoke' ||
       github.event.issue.title == 'controller: handoff-verify-v1' ||
       github.event.issue.title == 'controller: risk-v2-severity-persistence-v1' ||
       github.event.issue.title == 'controller: risk-v2-phase1b-ordering-calibration-v1' ||
       github.event.issue.title == 'controller: risk-v2-phase1b-carrier-inventory-v1' ||
       github.event.issue.title == 'controller: risk-v2-historical-000852-2015-2019-v1' ||
       github.event.issue.title == 'controller: risk-v2-temporal-stability-2015-2025-v1' ||
       github.event.issue.title == 'controller: risk-v2-15m-annual-calibration-diagnostic-v1' ||
       github.event.issue.title == 'controller: risk-v2-15m-tail-robust-calibration-v2' ||
       github.event.issue.title == 'controller: risk-v2-weekly-support-diagnostic-v1' ||
       github.event.issue.title == 'controller: risk-v2-weekly-window-feasibility-v1' ||
       github.event.issue.title == 'controller: risk-v2-temporal-stability-2week-v2' ||
       github.event.issue.title == 'controller: risk-v2-weekly-ordering-diagnostic-v1' ||
       github.event.issue.title == 'controller: risk-v2-temporal-stability-v3-adjudication' ||
       github.event.issue.title == 'controller: risk-v2-weekly-calibration-streak-diagnostic-v1' ||
       github.event.issue.title == 'controller: risk-v2-15m-state-conditional-calibration-diagnostic-v1' ||
       github.event.issue.title == 'controller: risk-v2-15m-within-cell-drift-carrier-diagnostic-v1' ||
       github.event.issue.title == 'controller: overnight-carrier-materialization-v1' ||
       github.event.issue.title == 'controller: overnight-continuous-tail-likelihood-dev-v1' ||
       github.event.issue.title == 'controller: overnight-continuous-tail-likelihood-blackbox-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      REQUEST_TITLE: ${{ github.event.issue.title }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch approved standard profile
        shell: bash
        run: |
          set -euo pipefail
          case "$REQUEST_TITLE" in
            'controller: runtime-smoke')
              profile='runtime-smoke'
              ;;
            'controller: handoff-verify-v1')
              profile='handoff-verify-v1'
              ;;
            'controller: risk-v2-severity-persistence-v1')
              profile='risk-v2-severity-persistence-v1'
              ;;
            'controller: risk-v2-phase1b-ordering-calibration-v1')
              profile='risk-v2-phase1b-ordering-calibration-v1'
              ;;
            'controller: risk-v2-phase1b-carrier-inventory-v1')
              profile='risk-v2-phase1b-carrier-inventory-v1'
              ;;
            'controller: risk-v2-historical-000852-2015-2019-v1')
              profile='risk-v2-historical-000852-2015-2019-v1'
              ;;
            'controller: risk-v2-temporal-stability-2015-2025-v1')
              profile='risk-v2-temporal-stability-2015-2025-v1'
              ;;
            'controller: risk-v2-15m-annual-calibration-diagnostic-v1')
              profile='risk-v2-15m-annual-calibration-diagnostic-v1'
              ;;
            'controller: risk-v2-15m-tail-robust-calibration-v2')
              profile='risk-v2-15m-tail-robust-calibration-v2'
              ;;
            'controller: risk-v2-weekly-support-diagnostic-v1')
              profile='risk-v2-weekly-support-diagnostic-v1'
              ;;
            'controller: risk-v2-weekly-window-feasibility-v1')
              profile='risk-v2-weekly-window-feasibility-v1'
              ;;
            'controller: risk-v2-temporal-stability-2week-v2')
              profile='risk-v2-temporal-stability-2week-v2'
              ;;
            'controller: risk-v2-weekly-ordering-diagnostic-v1')
              profile='risk-v2-weekly-ordering-diagnostic-v1'
              ;;
            'controller: risk-v2-temporal-stability-v3-adjudication')
              profile='risk-v2-temporal-stability-v3-adjudication'
              ;;
            'controller: risk-v2-weekly-calibration-streak-diagnostic-v1')
              profile='risk-v2-weekly-calibration-streak-diagnostic-v1'
              ;;
            'controller: risk-v2-15m-state-conditional-calibration-diagnostic-v1')
              profile='risk-v2-15m-state-conditional-calibration-diagnostic-v1'
              ;;
            'controller: risk-v2-15m-within-cell-drift-carrier-diagnostic-v1')
              profile='risk-v2-15m-within-cell-drift-carrier-diagnostic-v1'
              ;;
            'controller: overnight-carrier-materialization-v1')
              profile='overnight-carrier-materialization-v1'
              ;;
            'controller: overnight-continuous-tail-likelihood-dev-v1')
              profile='overnight-continuous-tail-likelihood-dev-v1'
              ;;
            'controller: overnight-continuous-tail-likelihood-blackbox-v1')
              profile='overnight-continuous-tail-likelihood-blackbox-v1'
              ;;
            *)
              echo 'Execution stopped: unapproved_controller_request' >&2
              exit 64
              ;;
          esac
          gh api \
            --method POST \
            repos/staryocean0/csi1000-timing-strategy-public/actions/workflows/public-compute.yml/dispatches \
            -f ref='cloud-workspace-v1' \
            -f "inputs[profile]=$profile"
          echo 'Approved standard workflow_dispatch submitted.'
