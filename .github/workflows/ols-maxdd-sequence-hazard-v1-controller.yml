name: OLS MaxDD sequence-hazard bounded controller

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read
  actions: write

concurrency:
  group: ols-maxdd-sequence-hazard-controller-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'staryocean0/csi1000-timing-strategy-public' &&
      github.event_name == 'issues' &&
      github.event.action == 'opened' &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == 'controller: ols-maxdd-sequence-hazard-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch preregistered bounded study
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            repos/staryocean0/csi1000-timing-strategy-public/actions/workflows/ols-maxdd-sequence-hazard-v1.yml/dispatches \
            -f ref='cloud-workspace-v1'
          echo 'Approved OLS sequence-hazard workflow_dispatch submitted.'
