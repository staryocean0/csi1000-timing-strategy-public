name: CSI1000 standard public executor
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Reviewed execution profile
        type: choice
        options:
          - runtime-smoke
          - handoff-verify-v1
          - risk-v2-severity-persistence-v1
          - risk-v2-phase1-calibration-diagnostic-20260914
          - risk-v2-phase1b-ordering-calibration-v1
          - risk-v2-historical-000852-2015-2019-v1
          - risk-v2-temporal-stability-2015-2025-v1
          - overnight-official-inventory-v1
          - overnight-carrier-materialization-v1
          - overnight-continuous-tail-likelihood-dev-v1
          - overnight-continuous-tail-likelihood-blackbox-v1
        default: runtime-smoke
        required: true
permissions:
  contents: read
concurrency:
  group: csi1000-standard-executor
  cancel-in-progress: false
jobs:
  execute:
    if: >-
      github.repository == 'staryocean0/csi1000-timing-strategy-public' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/cloud-workspace-v1' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: private-research
    timeout-minutes: 50
    steps:
      - name: Checkout reviewed public executor only
        timeout-minutes: 3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            executor
            tests
            docs/research
            docs/acceptance
            governance/private_sync
            .github/workflows
            governance/private_sync/v1
          sparse-checkout-cone-mode: true
      - name: Synthetic executor tests
        timeout-minutes: 2
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build public runtime before private credentials or data
        timeout-minutes: 8
        run: docker build --tag factorlab-runtime:local executor
      - name: Prove isolated runtime with no private data
        timeout-minutes: 2
        run: python3 executor/broker.py runtime-smoke
      - name: Stage fixed public Overnight carriers without private credentials
        if: inputs.profile == 'overnight-carrier-materialization-v1'
        timeout-minutes: 4
        run: python3 executor/overnight_carrier_stage_public.py
      - name: Stage fixed public Overnight BLACKBOX inputs without private credentials
        if: inputs.profile == 'overnight-continuous-tail-likelihood-blackbox-v1'
        timeout-minutes: 2
        run: python3 executor/overnight_tail_blackbox_stage_public.py
      - name: Prepare fixed private inputs
        id: prepare
        if: inputs.profile == 'handoff-verify-v1' || inputs.profile == 'risk-v2-severity-persistence-v1' || inputs.profile == 'risk-v2-phase1-calibration-diagnostic-20260914' || inputs.profile == 'risk-v2-phase1b-ordering-calibration-v1' || inputs.profile == 'risk-v2-historical-000852-2015-2019-v1' || inputs.profile == 'risk-v2-temporal-stability-2015-2025-v1' || inputs.profile == 'overnight-official-inventory-v1' || inputs.profile == 'overnight-carrier-materialization-v1' || inputs.profile == 'overnight-continuous-tail-likelihood-dev-v1' || inputs.profile == 'overnight-continuous-tail-likelihood-blackbox-v1'
        timeout-minutes: 8
        env:
          FACTORLAB_PRIVATE_TOKEN: ${{ secrets.FACTORLAB_PRIVATE_TOKEN }}
        run: |
          if [ '${{ inputs.profile }}' = 'handoff-verify-v1' ]; then
            python3 executor/research_broker.py prepare handoff-verify-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-severity-persistence-v1' ]; then
            python3 executor/risk_research_broker.py prepare risk-v2-severity-persistence-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-phase1-calibration-diagnostic-20260914' ]; then
            python3 executor/risk_v2_calibration_diagnostic_broker.py prepare risk-v2-phase1-calibration-diagnostic-20260914
          elif [ '${{ inputs.profile }}' = 'risk-v2-phase1b-ordering-calibration-v1' ]; then
            python3 executor/risk_phase1b_release_broker.py prepare risk-v2-phase1b-ordering-calibration-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-historical-000852-2015-2019-v1' ]; then
            python3 executor/risk_historical_000852_broker.py prepare risk-v2-historical-000852-2015-2019-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-temporal-stability-2015-2025-v1' ]; then
            python3 executor/risk_temporal_stability_2015_2025_broker.py prepare risk-v2-temporal-stability-2015-2025-v1
          elif [ '${{ inputs.profile }}' = 'overnight-official-inventory-v1' ]; then
            python3 executor/overnight_inventory_broker.py prepare overnight-official-inventory-v1
          elif [ '${{ inputs.profile }}' = 'overnight-carrier-materialization-v1' ]; then
            python3 executor/overnight_carrier_materialization_broker.py prepare overnight-carrier-materialization-v1
          elif [ '${{ inputs.profile }}' = 'overnight-continuous-tail-likelihood-dev-v1' ]; then
            python3 executor/overnight_tail_likelihood_entry.py prepare overnight-continuous-tail-likelihood-dev-v1
          elif [ '${{ inputs.profile }}' = 'overnight-continuous-tail-likelihood-blackbox-v1' ]; then
            python3 executor/overnight_tail_blackbox_broker.py prepare overnight-continuous-tail-likelihood-blackbox-v1
          else
            exit 2
          fi
      - name: Compute without private credentials
        if: inputs.profile == 'handoff-verify-v1' || inputs.profile == 'risk-v2-severity-persistence-v1' || inputs.profile == 'risk-v2-phase1-calibration-diagnostic-20260914' || inputs.profile == 'risk-v2-phase1b-ordering-calibration-v1' || inputs.profile == 'risk-v2-historical-000852-2015-2019-v1' || inputs.profile == 'risk-v2-temporal-stability-2015-2025-v1' || inputs.profile == 'overnight-official-inventory-v1' || inputs.profile == 'overnight-carrier-materialization-v1' || inputs.profile == 'overnight-continuous-tail-likelihood-dev-v1' || inputs.profile == 'overnight-continuous-tail-likelihood-blackbox-v1'
        timeout-minutes: 20
        run: |
          if [ '${{ inputs.profile }}' = 'handoff-verify-v1' ]; then
            python3 executor/research_broker.py compute handoff-verify-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-severity-persistence-v1' ]; then
            python3 executor/risk_research_broker.py compute risk-v2-severity-persistence-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-phase1-calibration-diagnostic-20260914' ]; then
            python3 executor/risk_v2_calibration_diagnostic_broker.py compute risk-v2-phase1-calibration-diagnostic-20260914
          elif [ '${{ inputs.profile }}' = 'risk-v2-phase1b-ordering-calibration-v1' ]; then
            python3 executor/risk_phase1b_release_broker.py compute risk-v2-phase1b-ordering-calibration-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-historical-000852-2015-2019-v1' ]; then
            python3 executor/risk_historical_000852_broker.py compute risk-v2-historical-000852-2015-2019-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-temporal-stability-2015-2025-v1' ]; then
            python3 executor/risk_temporal_stability_2015_2025_broker.py compute risk-v2-temporal-stability-2015-2025-v1
          elif [ '${{ inputs.profile }}' = 'overnight-official-inventory-v1' ]; then
            python3 executor/overnight_inventory_broker.py compute overnight-official-inventory-v1
          elif [ '${{ inputs.profile }}' = 'overnight-carrier-materialization-v1' ]; then
            python3 executor/overnight_carrier_materialization_broker.py compute overnight-carrier-materialization-v1
          elif [ '${{ inputs.profile }}' = 'overnight-continuous-tail-likelihood-dev-v1' ]; then
            python3 executor/overnight_tail_likelihood_entry.py compute overnight-continuous-tail-likelihood-dev-v1
          elif [ '${{ inputs.profile }}' = 'overnight-continuous-tail-likelihood-blackbox-v1' ]; then
            python3 executor/overnight_tail_blackbox_broker.py compute overnight-continuous-tail-likelihood-blackbox-v1
          else
            exit 2
          fi
      - name: Stop owned container before credentials return
        id: cleanup
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 1
        run: |
          if [ '${{ inputs.profile }}' = 'handoff-verify-v1' ]; then
            python3 executor/research_broker.py cleanup handoff-verify-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-severity-persistence-v1' ]; then
            python3 executor/risk_research_broker.py cleanup risk-v2-severity-persistence-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-phase1-calibration-diagnostic-20260914' ]; then
            python3 executor/risk_v2_calibration_diagnostic_broker.py cleanup risk-v2-phase1-calibration-diagnostic-20260914
          elif [ '${{ inputs.profile }}' = 'risk-v2-phase1b-ordering-calibration-v1' ]; then
            python3 executor/risk_phase1b_release_broker.py cleanup risk-v2-phase1b-ordering-calibration-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-historical-000852-2015-2019-v1' ]; then
            python3 executor/risk_historical_000852_broker.py cleanup risk-v2-historical-000852-2015-2019-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-temporal-stability-2015-2025-v1' ]; then
            python3 executor/risk_temporal_stability_2015_2025_broker.py cleanup risk-v2-temporal-stability-2015-2025-v1
          elif [ '${{ inputs.profile }}' = 'overnight-official-inventory-v1' ]; then
            python3 executor/overnight_inventory_broker.py cleanup overnight-official-inventory-v1
          elif [ '${{ inputs.profile }}' = 'overnight-carrier-materialization-v1' ]; then
            python3 executor/overnight_carrier_materialization_broker.py cleanup overnight-carrier-materialization-v1
          elif [ '${{ inputs.profile }}' = 'overnight-continuous-tail-likelihood-dev-v1' ]; then
            python3 executor/overnight_tail_likelihood_entry.py cleanup overnight-continuous-tail-likelihood-dev-v1
          elif [ '${{ inputs.profile }}' = 'overnight-continuous-tail-likelihood-blackbox-v1' ]; then
            python3 executor/overnight_tail_blackbox_broker.py cleanup overnight-continuous-tail-likelihood-blackbox-v1
          else
            exit 2
          fi
      - name: Return verified results privately
        if: always() && steps.prepare.outcome == 'success' && steps.cleanup.outcome == 'success'
        timeout-minutes: 8
        env:
          FACTORLAB_PRIVATE_TOKEN: ${{ secrets.FACTORLAB_PRIVATE_TOKEN }}
        run: |
          if [ '${{ inputs.profile }}' = 'handoff-verify-v1' ]; then
            python3 executor/research_broker.py publish handoff-verify-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-severity-persistence-v1' ]; then
            python3 executor/risk_research_broker.py publish risk-v2-severity-persistence-v1
            python3 executor/risk_success_mirror.py
          elif [ '${{ inputs.profile }}' = 'risk-v2-phase1-calibration-diagnostic-20260914' ]; then
            python3 executor/risk_v2_calibration_diagnostic_broker.py publish risk-v2-phase1-calibration-diagnostic-20260914
          elif [ '${{ inputs.profile }}' = 'risk-v2-phase1b-ordering-calibration-v1' ]; then
            python3 executor/risk_phase1b_release_broker.py publish risk-v2-phase1b-ordering-calibration-v1
            python3 executor/risk_phase1b_private_mirror.py
          elif [ '${{ inputs.profile }}' = 'risk-v2-historical-000852-2015-2019-v1' ]; then
            python3 executor/risk_historical_000852_broker.py publish risk-v2-historical-000852-2015-2019-v1
            python3 executor/risk_historical_private_mirror.py
          elif [ '${{ inputs.profile }}' = 'risk-v2-temporal-stability-2015-2025-v1' ]; then
            python3 executor/risk_temporal_stability_2015_2025_broker.py publish risk-v2-temporal-stability-2015-2025-v1
            python3 executor/risk_temporal_stability_private_mirror.py
          elif [ '${{ inputs.profile }}' = 'overnight-official-inventory-v1' ]; then
            python3 executor/overnight_inventory_broker.py publish overnight-official-inventory-v1
          elif [ '${{ inputs.profile }}' = 'overnight-carrier-materialization-v1' ]; then
            python3 executor/overnight_carrier_materialization_broker.py publish overnight-carrier-materialization-v1
          elif [ '${{ inputs.profile }}' = 'overnight-continuous-tail-likelihood-dev-v1' ]; then
            python3 executor/overnight_tail_likelihood_entry.py publish overnight-continuous-tail-likelihood-dev-v1
          elif [ '${{ inputs.profile }}' = 'overnight-continuous-tail-likelihood-blackbox-v1' ]; then
            python3 executor/overnight_tail_blackbox_broker.py publish overnight-continuous-tail-likelihood-blackbox-v1
          else
            exit 2
          fi
