          elif [ '${{ inputs.profile }}' = 'risk-v2-15m-probability-validity-guard-v1' ]; then
            python3 executor/risk_probability_validity_guard_v1_broker.py compute risk-v2-15m-probability-validity-guard-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-15m-continuous-reliability-score-v1' ]; then
