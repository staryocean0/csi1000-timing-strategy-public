          elif [ '${{ inputs.profile }}' = 'risk-v2-weekly-support-diagnostic-v1' ]; then
            python3 executor/risk_weekly_support_diagnostic_broker.py cleanup risk-v2-weekly-support-diagnostic-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-weekly-window-feasibility-v1' ]; then
            python3 executor/risk_weekly_window_feasibility_broker.py cleanup risk-v2-weekly-window-feasibility-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-temporal-stability-2week-v2' ]; then
            python3 executor/risk_temporal_stability_2week_v2_broker.py cleanup risk-v2-temporal-stability-2week-v2
          elif [ '${{ inputs.profile }}' = 'risk-v2-weekly-ordering-diagnostic-v1' ]; then
            python3 executor/risk_weekly_ordering_diagnostic_broker.py cleanup risk-v2-weekly-ordering-diagnostic-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-temporal-stability-v3-adjudication' ]; then
            python3 executor/risk_temporal_v3_adjudication_broker.py cleanup risk-v2-temporal-stability-v3-adjudication
          elif [ '${{ inputs.profile }}' = 'risk-v2-weekly-calibration-streak-diagnostic-v1' ]; then
            python3 executor/risk_weekly_calibration_streak_diagnostic_broker.py cleanup risk-v2-weekly-calibration-streak-diagnostic-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-15m-state-conditional-calibration-diagnostic-v1' ]; then
            python3 executor/risk_state_conditional_calibration_diagnostic_broker.py cleanup risk-v2-15m-state-conditional-calibration-diagnostic-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-15m-within-cell-drift-carrier-diagnostic-v1' ]; then
            python3 executor/risk_within_cell_drift_carrier_diagnostic_broker.py cleanup risk-v2-15m-within-cell-drift-carrier-diagnostic-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-15m-online-prior-calibration-v3' ]; then
            python3 executor/risk_online_prior_calibration_v3_broker.py cleanup risk-v2-15m-online-prior-calibration-v3
          elif [ '${{ inputs.profile }}' = 'risk-v2-15m-hierarchical-prior-calibration-v4' ]; then
            python3 executor/risk_hierarchical_prior_calibration_v4_broker.py cleanup risk-v2-15m-hierarchical-prior-calibration-v4
          elif [ '${{ inputs.profile }}' = 'risk-v2-15m-probability-validity-guard-v1' ]; then
            python3 executor/risk_probability_validity_guard_v1_broker.py cleanup risk-v2-15m-probability-validity-guard-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-15m-continuous-reliability-score-v1' ]; then
