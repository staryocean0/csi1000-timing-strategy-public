name: CSI1000 standard public executor
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Reviewed execution profile
        type: choice
        options:
          - runtime-smoke
          - handoff-verify-v1
          - risk-v2-severity-persistence-v1
          - risk-v2-phase1-calibration-diagnostic-20260914
          - risk-v2-phase1b-ordering-calibration-v1
          - risk-v2-phase1b-carrier-inventory-v1
          - risk-v2-historical-000852-2015-2019-v1
          - risk-v2-temporal-stability-2015-2025-v1
          - risk-v2-15m-annual-calibration-diagnostic-v1
          - risk-v2-15m-tail-robust-calibration-v2
          - risk-v2-weekly-support-diagnostic-v1
          - risk-v2-weekly-window-feasibility-v1
          - risk-v2-temporal-stability-2week-v2
          - risk-v2-weekly-ordering-diagnostic-v1
          - risk-v2-temporal-stability-v3-adjudication
          - risk-v2-weekly-calibration-streak-diagnostic-v1
          - risk-v2-15m-state-conditional-calibration-diagnostic-v1
          - risk-v2-15m-within-cell-drift-carrier-diagnostic-v1
          - risk-v2-15m-online-prior-calibration-v3
          - risk-v2-15m-hierarchical-prior-calibration-v4
          - risk-v2-15m-probability-validity-guard-v1
          - risk-v2-15m-continuous-reliability-score-v1
          - risk-v2-probability-reliability-output-contract-v1
          - two-wave-v0800-duration-scale-map-v1
          - overnight-official-inventory-v1
          - overnight-carrier-materialization-v1
          - overnight-continuous-tail-likelihood-dev-v1
          - overnight-continuous-tail-likelihood-blackbox-v1
        default: runtime-smoke
        required: true
permissions:
  contents: read
concurrency:
  group: csi1000-standard-executor
  cancel-in-progress: false
jobs:
  execute:
    if: >-
      github.repository == 'staryocean0/csi1000-timing-strategy-public' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/cloud-workspace-v1' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: private-research
    timeout-minutes: 50
    steps:
      - name: Checkout reviewed public executor only
        timeout-minutes: 3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            executor
            tests
            docs/research
            docs/acceptance
            governance/private_sync
            .github/workflows
            governance/private_sync/v1
          sparse-checkout-cone-mode: true
      - name: Synthetic executor tests
        timeout-minutes: 2
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build public runtime before private credentials or data
        timeout-minutes: 8
        run: docker build --tag factorlab-runtime:local executor
      - name: Prove isolated runtime with no private data
        timeout-minutes: 2
        run: python3 executor/broker.py runtime-smoke
      - name: Stage fixed public Overnight carriers without private credentials
        if: inputs.profile == 'overnight-carrier-materialization-v1'
        timeout-minutes: 4
        run: python3 executor/overnight_carrier_stage_public.py
      - name: Stage fixed public Overnight BLACKBOX inputs without private credentials
        if: inputs.profile == 'overnight-continuous-tail-likelihood-blackbox-v1'
        timeout-minutes: 2
        run: python3 executor/overnight_tail_blackbox_stage_public.py
      - name: Prepare fixed private inputs
        id: prepare
        if: inputs.profile == 'handoff-verify-v1' || inputs.profile == 'risk-v2-severity-persistence-v1' || inputs.profile == 'risk-v2-phase1-calibration-diagnostic-20260914' || inputs.profile == 'risk-v2-phase1b-ordering-calibration-v1' || inputs.profile == 'risk-v2-phase1b-carrier-inventory-v1' || inputs.profile == 'risk-v2-historical-000852-2015-2019-v1' || inputs.profile == 'risk-v2-temporal-stability-2015-2025-v1' || inputs.profile == 'risk-v2-15m-annual-calibration-diagnostic-v1' || inputs.profile == 'risk-v2-15m-tail-robust-calibration-v2' || inputs.profile == 'risk-v2-weekly-support-diagnostic-v1' || inputs.profile == 'risk-v2-weekly-window-feasibility-v1' || inputs.profile == 'risk-v2-temporal-stability-2week-v2' || inputs.profile == 'risk-v2-weekly-ordering-diagnostic-v1' || inputs.profile == 'risk-v2-temporal-stability-v3-adjudication' || inputs.profile == 'risk-v2-weekly-calibration-streak-diagnostic-v1' || inputs.profile == 'risk-v2-15m-state-conditional-calibration-diagnostic-v1' || inputs.profile == 'risk-v2-15m-within-cell-drift-carrier-diagnostic-v1' || inputs.profile == 'risk-v2-15m-online-prior-calibration-v3' || inputs.profile == 'risk-v2-15m-hierarchical-prior-calibration-v4' || inputs.profile == 'risk-v2-15m-probability-validity-guard-v1' || inputs.profile == 'risk-v2-15m-continuous-reliability-score-v1' || inputs.profile == 'risk-v2-probability-reliability-output-contract-v1' || inputs.profile == 'two-wave-v0800-duration-scale-map-v1' || inputs.profile == 'overnight-official-inventory-v1' || inputs.profile == 'overnight-carrier-materialization-v1' || inputs.profile == 'overnight-continuous-tail-likelihood-dev-v1' || inputs.profile == 'overnight-continuous-tail-likelihood-blackbox-v1'
        timeout-minutes: 6
        env:
          FACTORLAB_PRIVATE_TOKEN: ${{ secrets.FACTORLAB_PRIVATE_TOKEN }}
        run: |
          if [ '${{ inputs.profile }}' = 'handoff-verify-v1' ]; then
            python3 executor/research_broker.py prepare handoff-verify-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-severity-persistence-v1' ]; then
            python3 executor/risk_research_broker.py prepare risk-v2-severity-persistence-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-phase1-calibration-diagnostic-20260914' ]; then
            python3 executor/risk_v2_calibration_diagnostic_broker.py prepare risk-v2-phase1-calibration-diagnostic-20260914
          elif [ '${{ inputs.profile }}' = 'risk-v2-phase1b-ordering-calibration-v1' ]; then
            python3 executor/risk_phase1b_release_broker.py prepare risk-v2-phase1b-ordering-calibration-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-phase1b-carrier-inventory-v1' ]; then
            python3 executor/risk_phase1b_carrier_inventory_broker.py prepare risk-v2-phase1b-carrier-inventory-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-historical-000852-2015-2019-v1' ]; then
            python3 executor/risk_historical_000852_broker.py prepare risk-v2-historical-000852-2015-2019-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-temporal-stability-2015-2025-v1' ]; then
            python3 executor/risk_temporal_stability_2015_2025_broker.py prepare risk-v2-temporal-stability-2015-2025-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-15m-annual-calibration-diagnostic-v1' ]; then
            python3 executor/risk_annual_calibration_diagnostic_broker.py prepare risk-v2-15m-annual-calibration-diagnostic-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-15m-tail-robust-calibration-v2' ]; then
            python3 executor/risk_annual_calibration_tail_robust_v2_broker.py prepare risk-v2-15m-tail-robust-calibration-v2
          elif [ '${{ inputs.profile }}' = 'risk-v2-weekly-support-diagnostic-v1' ]; then
            python3 executor/risk_weekly_support_diagnostic_broker.py prepare risk-v2-weekly-support-diagnostic-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-weekly-window-feasibility-v1' ]; then
            python3 executor/risk_weekly_window_feasibility_broker.py prepare risk-v2-weekly-window-feasibility-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-temporal-stability-2week-v2' ]; then
            python3 executor/risk_temporal_stability_2week_v2_broker.py prepare risk-v2-temporal-stability-2week-v2
          elif [ '${{ inputs.profile }}' = 'risk-v2-weekly-ordering-diagnostic-v1' ]; then
            python3 executor/risk_weekly_ordering_diagnostic_broker.py prepare risk-v2-weekly-ordering-diagnostic-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-temporal-stability-v3-adjudication' ]; then
            python3 executor/risk_temporal_v3_adjudication_broker.py prepare risk-v2-temporal-stability-v3-adjudication
          elif [ '${{ inputs.profile }}' = 'risk-v2-weekly-calibration-streak-diagnostic-v1' ]; then
            python3 executor/risk_weekly_calibration_streak_diagnostic_broker.py prepare risk-v2-weekly-calibration-streak-diagnostic-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-15m-state-conditional-calibration-diagnostic-v1' ]; then
            python3 executor/risk_state_conditional_calibration_diagnostic_broker.py prepare risk-v2-15m-state-conditional-calibration-diagnostic-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-15m-within-cell-drift-carrier-diagnostic-v1' ]; then
            python3 executor/risk_within_cell_drift_carrier_diagnostic_broker.py prepare risk-v2-15m-within-cell-drift-carrier-diagnostic-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-15m-online-prior-calibration-v3' ]; then
            python3 executor/risk_online_prior_calibration_v3_broker.py prepare risk-v2-15m-online-prior-calibration-v3
          elif [ '${{ inputs.profile }}' = 'risk-v2-15m-hierarchical-prior-calibration-v4' ]; then
            python3 executor/risk_hierarchical_prior_calibration_v4_broker.py prepare risk-v2-15m-hierarchical-prior-calibration-v4
          elif [ '${{ inputs.profile }}' = 'risk-v2-15m-probability-validity-guard-v1' ]; then
            python3 executor/risk_probability_validity_guard_v1_broker.py prepare risk-v2-15m-probability-validity-guard-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-15m-continuous-reliability-score-v1' ]; then
            python3 executor/risk_continuous_reliability_score_v1_broker.py prepare risk-v2-15m-continuous-reliability-score-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-probability-reliability-output-contract-v1' ]; then
            python3 executor/risk_probability_reliability_output_contract_v1_broker.py prepare risk-v2-probability-reliability-output-contract-v1
          elif [ '${{ inputs.profile }}' = 'two-wave-v0800-duration-scale-map-v1' ]; then
            python3 executor/two_wave_v0800_scale_map_broker.py prepare two-wave-v0800-duration-scale-map-v1
          elif [ '${{ inputs.profile }}' = 'overnight-official-inventory-v1' ]; then
            python3 executor/overnight_inventory_broker.py prepare overnight-official-inventory-v1
          elif [ '${{ inputs.profile }}' = 'overnight-carrier-materialization-v1' ]; then
            python3 executor/overnight_carrier_materialization_broker.py prepare overnight-carrier-materialization-v1
          elif [ '${{ inputs.profile }}' = 'overnight-continuous-tail-likelihood-dev-v1' ]; then
            python3 executor/overnight_tail_likelihood_entry.py prepare overnight-continuous-tail-likelihood-dev-v1
          elif [ '${{ inputs.profile }}' = 'overnight-continuous-tail-likelihood-blackbox-v1' ]; then
            python3 executor/overnight_tail_blackbox_broker.py prepare overnight-continuous-tail-likelihood-blackbox-v1
          else
            exit 2
          fi
      - name: Compute without private credentials
        if: inputs.profile == 'handoff-verify-v1' || inputs.profile == 'risk-v2-severity-persistence-v1' || inputs.profile == 'risk-v2-phase1-calibration-diagnostic-20260914' || inputs.profile == 'risk-v2-phase1b-ordering-calibration-v1' || inputs.profile == 'risk-v2-phase1b-carrier-inventory-v1' || inputs.profile == 'risk-v2-historical-000852-2015-2019-v1' || inputs.profile == 'risk-v2-temporal-stability-2015-2025-v1' || inputs.profile == 'risk-v2-15m-annual-calibration-diagnostic-v1' || inputs.profile == 'risk-v2-15m-tail-robust-calibration-v2' || inputs.profile == 'risk-v2-weekly-support-diagnostic-v1' || inputs.profile == 'risk-v2-weekly-window-feasibility-v1' || inputs.profile == 'risk-v2-temporal-stability-2week-v2' || inputs.profile == 'risk-v2-weekly-ordering-diagnostic-v1' || inputs.profile == 'risk-v2-temporal-stability-v3-adjudication' || inputs.profile == 'risk-v2-weekly-calibration-streak-diagnostic-v1' || inputs.profile == 'risk-v2-15m-state-conditional-calibration-diagnostic-v1' || inputs.profile == 'risk-v2-15m-within-cell-drift-carrier-diagnostic-v1' || inputs.profile == 'risk-v2-15m-online-prior-calibration-v3' || inputs.profile == 'risk-v2-15m-hierarchical-prior-calibration-v4' || inputs.profile == 'risk-v2-15m-probability-validity-guard-v1' || inputs.profile == 'risk-v2-15m-continuous-reliability-score-v1' || inputs.profile == 'risk-v2-probability-reliability-output-contract-v1' || inputs.profile == 'two-wave-v0800-duration-scale-map-v1' || inputs.profile == 'overnight-official-inventory-v1' || inputs.profile == 'overnight-carrier-materialization-v1' || inputs.profile == 'overnight-continuous-tail-likelihood-dev-v1' || inputs.profile == 'overnight-continuous-tail-likelihood-blackbox-v1'
        timeout-minutes: 16
        run: |
          if [ '${{ inputs.profile }}' = 'handoff-verify-v1' ]; then
            python3 executor/research_broker.py compute handoff-verify-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-severity-persistence-v1' ]; then
            python3 executor/risk_research_broker.py compute risk-v2-severity-persistence-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-phase1-calibration-diagnostic-20260914' ]; then
            python3 executor/risk_v2_calibration_diagnostic_broker.py compute risk-v2-phase1-calibration-diagnostic-20260914
          elif [ '${{ inputs.profile }}' = 'risk-v2-phase1b-ordering-calibration-v1' ]; then
            python3 executor/risk_phase1b_release_broker.py compute risk-v2-phase1b-ordering-calibration-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-phase1b-carrier-inventory-v1' ]; then
            python3 executor/risk_phase1b_carrier_inventory_broker.py compute risk-v2-phase1b-carrier-inventory-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-historical-000852-2015-2019-v1' ]; then
            python3 executor/risk_historical_000852_broker.py compute risk-v2-historical-000852-2015-2019-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-temporal-stability-2015-2025-v1' ]; then
            python3 executor/risk_temporal_stability_2015_2025_broker.py compute risk-v2-temporal-stability-2015-2025-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-15m-annual-calibration-diagnostic-v1' ]; then
            python3 executor/risk_annual_calibration_diagnostic_broker.py compute risk-v2-15m-annual-calibration-diagnostic-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-15m-tail-robust-calibration-v2' ]; then
            python3 executor/risk_annual_calibration_tail_robust_v2_broker.py compute risk-v2-15m-tail-robust-calibration-v2
          elif [ '${{ inputs.profile }}' = 'risk-v2-weekly-support-diagnostic-v1' ]; then
            python3 executor/risk_weekly_support_diagnostic_broker.py compute risk-v2-weekly-support-diagnostic-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-weekly-window-feasibility-v1' ]; then
            python3 executor/risk_weekly_window_feasibility_broker.py compute risk-v2-weekly-window-feasibility-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-temporal-stability-2week-v2' ]; then
            python3 executor/risk_temporal_stability_2week_v2_broker.py compute risk-v2-temporal-stability-2week-v2
          elif [ '${{ inputs.profile }}' = 'risk-v2-weekly-ordering-diagnostic-v1' ]; then
            python3 executor/risk_weekly_ordering_diagnostic_broker.py compute risk-v2-weekly-ordering-diagnostic-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-temporal-stability-v3-adjudication' ]; then
            python3 executor/risk_temporal_v3_adjudication_broker.py compute risk-v2-temporal-stability-v3-adjudication
          elif [ '${{ inputs.profile }}' = 'risk-v2-weekly-calibration-streak-diagnostic-v1' ]; then
            python3 executor/risk_weekly_calibration_streak_diagnostic_broker.py compute risk-v2-weekly-calibration-streak-diagnostic-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-15m-state-conditional-calibration-diagnostic-v1' ]; then
            python3 executor/risk_state_conditional_calibration_diagnostic_broker.py compute risk-v2-15m-state-conditional-calibration-diagnostic-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-15m-within-cell-drift-carrier-diagnostic-v1' ]; then
            python3 executor/risk_within_cell_drift_carrier_diagnostic_broker.py compute risk-v2-15m-within-cell-drift-carrier-diagnostic-v1
          elif [ '${{ inputs.profile }}' = 'risk-v2-15m-online-prior-calibration-v3' ]; then
