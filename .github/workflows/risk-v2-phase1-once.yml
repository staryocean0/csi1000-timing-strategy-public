name: Risk Tool 2.0 Phase-1 one-shot launcher

on:
  push:
    branches:
      - cloud-workspace-v1
    paths:
      - executor/.risk-v2-phase1-run-now

permissions:
  contents: read

concurrency:
  group: csi1000-standard-executor
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.repository == 'staryocean0/csi1000-timing-strategy-public' &&
      github.ref == 'refs/heads/cloud-workspace-v1' &&
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: private-research
    timeout-minutes: 45
    steps:
      - name: Checkout exact reviewed public executor
        timeout-minutes: 3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8c514f058649870d4ae063ba62c4b28769850530
          persist-credentials: false
          sparse-checkout: |
            executor
            tests
            .github/workflows
          sparse-checkout-cone-mode: true

      - name: Assert frozen public executor identity
        run: test "$(git rev-parse HEAD)" = "8c514f058649870d4ae063ba62c4b28769850530"

      - name: Synthetic executor tests
        timeout-minutes: 2
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build public runtime before private credentials or data
        timeout-minutes: 8
        run: docker build --tag factorlab-runtime:local executor

      - name: Prove isolated runtime with no private data
        timeout-minutes: 2
        run: GITHUB_EVENT_NAME=workflow_dispatch python3 executor/broker.py runtime-smoke

      - name: Prepare fixed Risk Tool 2.0 inputs
        id: prepare
        timeout-minutes: 6
        env:
          FACTORLAB_PRIVATE_TOKEN: ${{ secrets.FACTORLAB_PRIVATE_TOKEN }}
        run: GITHUB_EVENT_NAME=workflow_dispatch python3 executor/risk_research_broker.py prepare risk-v2-severity-persistence-v1

      - name: Compute without private credentials
        timeout-minutes: 16
        run: GITHUB_EVENT_NAME=workflow_dispatch python3 executor/risk_research_broker.py compute risk-v2-severity-persistence-v1

      - name: Stop owned container before credentials return
        id: cleanup
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 1
        run: GITHUB_EVENT_NAME=workflow_dispatch python3 executor/risk_research_broker.py cleanup risk-v2-severity-persistence-v1

      - name: Return verified results privately
        if: always() && steps.prepare.outcome == 'success' && steps.cleanup.outcome == 'success'
        timeout-minutes: 6
        env:
          FACTORLAB_PRIVATE_TOKEN: ${{ secrets.FACTORLAB_PRIVATE_TOKEN }}
        run: GITHUB_EVENT_NAME=workflow_dispatch python3 executor/risk_research_broker.py publish risk-v2-severity-persistence-v1
