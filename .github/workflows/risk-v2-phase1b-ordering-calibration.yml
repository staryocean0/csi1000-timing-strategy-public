name: Risk v2 Phase1b ordering calibration

on:
  push:
    branches:
      - cloud-workspace-v1
    paths:
      - 'executor/risk_phase1b_run.py'
      - 'executor/risk_phase1b_verify.py'
      - 'executor/risk_phase1b_broker.py'
      - 'executor/risk_phase1b_private_mirror.py'
      - 'docs/research/RISK_TOOL_V2_PHASE1B_ORDERING_CALIBRATION_PROTOCOL_20260914.json'
      - '.github/workflows/risk-v2-phase1b-ordering-calibration.yml'

permissions:
  contents: read

jobs:
  phase1b:
    if: >-
      github.repository == 'staryocean0/csi1000-timing-strategy-public' &&
      github.ref == 'refs/heads/cloud-workspace-v1' &&
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: private-research
    timeout-minutes: 30
    steps:
      - name: Checkout fixed Phase-1b executor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            executor
            docs/research/RISK_TOOL_V2_PHASE1B_ORDERING_CALIBRATION_PROTOCOL_20260914.json
            .github/workflows/risk-v2-phase1b-ordering-calibration.yml
          sparse-checkout-cone-mode: true

      - name: Static compile check before private credentials
        run: >-
          python3 -m py_compile
          executor/risk_phase1b_run.py
          executor/risk_phase1b_verify.py
          executor/risk_phase1b_broker.py
          executor/risk_phase1b_private_mirror.py
          executor/research_broker.py
          executor/broker.py
          executor/run_research_in_container.py

      - name: Build isolated runtime before private credentials
        run: docker build --tag factorlab-runtime:local executor

      - name: Prepare immutable Phase-1 parent results
        id: prepare
        env:
          FACTORLAB_PRIVATE_TOKEN: ${{ secrets.FACTORLAB_PRIVATE_TOKEN }}
        run: python3 executor/risk_phase1b_broker.py prepare

      - name: Compute frozen Phase-1b without private credentials
        run: python3 executor/risk_phase1b_broker.py compute

      - name: Stop owned container before credentials return
        id: cleanup
        if: always() && steps.prepare.outcome == 'success'
        run: python3 executor/risk_phase1b_broker.py cleanup

      - name: Return verified Phase-1b results privately
        id: publish
        if: always() && steps.prepare.outcome == 'success' && steps.cleanup.outcome == 'success'
        env:
          FACTORLAB_PRIVATE_TOKEN: ${{ secrets.FACTORLAB_PRIVATE_TOKEN }}
        run: python3 executor/risk_phase1b_broker.py publish

      - name: Mirror verified Phase-1b summaries into private run branch
        if: steps.publish.outcome == 'success'
        env:
          FACTORLAB_PRIVATE_TOKEN: ${{ secrets.FACTORLAB_PRIVATE_TOKEN }}
        run: python3 executor/risk_phase1b_private_mirror.py
