name: Risk Tool 2.0 fixed diagnostic readback

on:
  push:
    branches:
      - cloud-workspace-v1
    paths:
      - executor/.risk-v2-readback-now

permissions:
  contents: read

jobs:
  readback:
    if: >-
      github.repository == 'staryocean0/csi1000-timing-strategy-public' &&
      github.ref == 'refs/heads/cloud-workspace-v1' &&
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: private-research
    timeout-minutes: 5
    steps:
      - name: Copy fixed verified diagnostics to private run branch
        env:
          FACTORLAB_PRIVATE_TOKEN: ${{ secrets.FACTORLAB_PRIVATE_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, io, json, os, tarfile, urllib.request

          token = os.environ['FACTORLAB_PRIVATE_TOKEN']
          repo = 'staryocean0/csi1000-timing-strategy-private'
          release_id = 388151208
          branch = 'runs/public-research/34806652445-1'
          allowed = {'compute.log', 'compute_receipt.json', 'controller_validation.json'}

          def request(url, *, accept='application/vnd.github+json', data=None, method=None):
              headers = {
                  'Authorization': 'Bearer ' + token,
                  'Accept': accept,
                  'User-Agent': 'factorlab-fixed-diagnostic-readback',
              }
              if data is not None:
                  data = json.dumps(data).encode()
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(url, headers=headers, data=data, method=method)
              with urllib.request.urlopen(req, timeout=120) as resp:
                  return resp.read()

          meta = json.loads(request(f'https://api.github.com/repos/{repo}/releases/{release_id}'))
          assets = meta.get('assets') or []
          if len(assets) != 1 or assets[0].get('name') != 'results.tar.gz' or assets[0].get('size', 0) > 4096:
              raise SystemExit('fixed release identity failed')
          raw = request(assets[0]['url'], accept='application/octet-stream')
          if len(raw) != assets[0]['size']:
              raise SystemExit('asset size mismatch')
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as tar:
              names = {m.name for m in tar.getmembers() if m.isfile()}
              if not allowed.issubset(names):
                  raise SystemExit('required diagnostics missing')
              for name in sorted(allowed):
                  member = tar.getmember(name)
                  if member.size > 4096:
                      raise SystemExit('diagnostic too large')
                  content = tar.extractfile(member).read()
                  target = f'research/public-runs/34806652445-1-diagnostics/{name}'
                  payload = {
                      'message': 'Record fixed private diagnostic readback [skip ci]',
                      'branch': branch,
                      'content': base64.b64encode(content).decode(),
                  }
                  request(f'https://api.github.com/repos/{repo}/contents/{target}', data=payload, method='PUT')
          print('fixed private diagnostic readback complete')
          PY
