name: Segmentation measurement S0 contracts
on:
  pull_request:
    branches: [cloud-workspace-v1]
    paths:
      - '.github/workflows/wave-measurement-s0-tests.yml'
      - 'executor/wave_measurement_audit_s0.py'
      - 'executor/wave_recognizer_r3_v1.py'
      - 'executor/wave_recognizer_r1_v1.py'
      - 'executor/wave_r3_clock_probe_v1.py'
      - 'executor/two_wave_v0800_scale_map.py'
      - 'tests/test_wave_measurement_s0*.py'
      - 'docs/research/TWO_WAVE_SEGMENTATION_MEASUREMENT*'
      - 'docs/research/TWO_WAVE_MEASUREMENT_S0*'
      - 'docs/research/TWO_WAVE_RESEARCH_LINEAGE_20260916.json'
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -r executor/requirements.txt
      - name: Synthetic counterexamples and source contracts only
        run: |
          python3 - <<'CHECKS'
          import sys,unittest
          suite=unittest.defaultTestLoader.discover('tests',pattern='test_wave_measurement_s0*.py')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          print(f'run={result.testsRun} skipped={len(result.skipped)}')
          sys.exit(0 if result.wasSuccessful() and not result.skipped and result.testsRun >= 35 else 1)
          CHECKS
