name: Two-Wave multiscale dual-gates v2 source tests
on:
  pull_request:
    branches: [cloud-workspace-v1]
    paths:
      - '.github/workflows/wave-multiscale-dual-gates-v2-source-tests.yml'
      - '.github/workflows/public-compute.yml'
      - '.github/workflows/controller-dispatch.yml'
      - 'executor/wave_multiscale_dual_gates_v2*.py'
      - 'executor/wave_dual_gate_hierarchy_v1.py'
      - 'executor/wave_dual_gate_probe_v1.py'
      - 'tests/test_wave_multiscale_dual_gates_v2*.py'
      - 'docs/research/TWO_WAVE_MULTISCALE_DUAL_GATES_V2*'
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout public source only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install public dependencies
        run: python3 -m pip install --disable-pip-version-check -r executor/requirements.txt
      - name: Run v2 synthetic and registration tests
        run: |
          python3 - <<'PY'
          import sys,unittest
          suite=unittest.defaultTestLoader.discover('tests',pattern='test_wave_multiscale_dual_gates_v2*.py')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          print(f'run={result.testsRun} skipped={len(result.skipped)}')
          sys.exit(0 if result.wasSuccessful() and not result.skipped and result.testsRun>=25 else 1)
          PY
