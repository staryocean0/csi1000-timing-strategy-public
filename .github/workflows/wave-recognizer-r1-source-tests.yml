name: Two-Wave recognizer R1 source tests
on:
  pull_request:
    branches: [cloud-workspace-v1]
    paths:
      - '.github/workflows/wave-recognizer-r1-source-tests.yml'
      - '.github/workflows/public-compute.yml'
      - '.github/workflows/controller-dispatch.yml'
      - 'executor/wave_recognizer_r1_v1*.py'
      - 'executor/wave_scale_specific_continuity_v1.py'
      - 'executor/wave_cycle_identifiability_v1.py'
      - 'tests/test_wave_recognizer_r1*.py'
      - 'docs/research/TWO_WAVE_RECOGNIZER_R1_*'
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -r executor/requirements.txt
      - name: Run recognizer R1 contracts
        run: |
          python3 - <<'PY'
          import sys,unittest
          suite=unittest.defaultTestLoader.discover('tests',pattern='test_wave_recognizer_r1*.py')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          print(f'run={result.testsRun} skipped={len(result.skipped)}')
          sys.exit(0 if result.wasSuccessful() and not result.skipped and result.testsRun >= 20 else 1)
          PY
