name: Two-Wave post-reference dominance market measurement contracts
on:
  pull_request:
    branches: [cloud-workspace-v1]
    paths:
      - '.github/workflows/public-compute.yml'
      - '.github/workflows/controller-dispatch.yml'
      - '.github/workflows/wave-scale-dominance-market-measurement-tests.yml'
      - 'executor/wave_scale_dominance_market_*'
      - 'executor/wave_scale_dominance_diagnostics_v1.py'
      - 'docs/research/TWO_WAVE_SCALE_DOMINANCE_MARKET_*'
      - 'docs/research/TWO_WAVE_RESEARCH_LINEAGE_20260916.json'
      - 'docs/research/TWO_WAVE_SEGMENTATION_DOMINANCE_THREAD_AUTHORITY_20260917.json'
      - 'tests/test_wave_scale_dominance_market_*'
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -r executor/requirements.txt
      - name: Diagnostic-only source and registration contracts
        run: |
          python3 - <<'PY'
          import sys,unittest
          suite=unittest.defaultTestLoader.discover('tests',pattern='test_wave_scale_dominance_market_*.py')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          print(f'run={result.testsRun} skipped={len(result.skipped)}')
          sys.exit(0 if result.wasSuccessful() and not result.skipped and result.testsRun >= 20 else 1)
          PY
