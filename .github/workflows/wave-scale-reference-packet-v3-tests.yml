name: Two-Wave blind reference packet v3 contracts
on:
  pull_request:
    branches: [cloud-workspace-v1]
    paths:
      - '.github/workflows/wave-scale-reference-packet-v3-tests.yml'
      - '.github/workflows/public-compute.yml'
      - '.github/workflows/controller-dispatch.yml'
      - 'executor/wave_scale_reference_packet_*v3.py'
      - 'executor/wave_scale_reference_packet_v2.py'
      - 'executor/wave_scale_reference_sampling_v2.py'
      - 'tests/test_wave_scale_reference_packet_v3.py'
      - 'tests/test_wave_scale_reference_packet_registration_v3.py'
      - 'tests/segmentation_carrier_registration_support.py'
      - 'docs/research/TWO_WAVE_SCALE_REFERENCE_PACKET_*V3*'
      - 'docs/research/TWO_WAVE_RESEARCH_LINEAGE_20260916.json'
      - 'docs/research/TWO_WAVE_SEGMENTATION_DOMINANCE_THREAD_AUTHORITY_20260917.json'
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -r executor/requirements.txt
      - name: Verifier taxonomy and registration contracts
        run: |
          python3 - <<'CHECKS'
          import sys,unittest
          names=[
            'tests.test_wave_scale_reference_packet_v3',
            'tests.test_wave_scale_reference_packet_registration_v3']
          suite=unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(x) for x in names)
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          print(f'run={result.testsRun} skipped={len(result.skipped)}')
          sys.exit(0 if result.wasSuccessful() and not result.skipped and result.testsRun >= 15 else 1)
          CHECKS
