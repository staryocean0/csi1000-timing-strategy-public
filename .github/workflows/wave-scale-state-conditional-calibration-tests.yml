name: Two-Wave state-conditional calibration source tests
on:
  pull_request:
    paths:
      - 'executor/wave_scale_state_conditional_calibration_v1.py'
      - 'tests/test_wave_scale_state_conditional_calibration_v1.py'
      - 'tests/test_wave_scale_state_conditional_calibration_source_v1.py'
      - 'docs/research/TWO_WAVE_SCALE_STATE_CONDITIONAL_CALIBRATION_PROTOCOL_20260917.json'
      - 'docs/research/TWO_WAVE_SCALE_STATE_CONDITIONAL_CALIBRATION_SOURCE_CHECKPOINT_20260917.json'
      - 'docs/research/TWO_WAVE_RESEARCH_LINEAGE_20260916.json'
      - 'docs/research/TWO_WAVE_SEGMENTATION_DOMINANCE_THREAD_AUTHORITY_20260917.json'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run pure calibration source contracts
        run: |
          python3 -m unittest \
            tests.test_wave_scale_state_conditional_calibration_v1 \
            tests.test_wave_scale_state_conditional_calibration_source_v1 -v
