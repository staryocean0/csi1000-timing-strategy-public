name: Two-Wave state-conditional calibration v2 tests
on:
  pull_request:
    paths:
      - 'executor/wave_scale_state_conditional_calibration_v2.py'
      - 'tests/test_wave_scale_state_conditional_calibration_v2.py'
      - 'docs/research/TWO_WAVE_SCALE_STATE_CONDITIONAL_CALIBRATION_V2_*'
      - '.github/workflows/wave-scale-state-conditional-calibration-v2-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python3 -m unittest tests.test_wave_scale_state_conditional_calibration_v2 -v
