name: Two-Wave calibration v4 source contracts
on:
  pull_request:
    branches: [cloud-workspace-v1]
    paths:
      - 'executor/wave_scale_state_conditional_calibration_v4.py'
      - 'docs/research/TWO_WAVE_SCALE_STATE_CONDITIONAL_CALIBRATION_V4_*'
      - 'docs/research/TWO_WAVE_SCALE_CAPACITY_AUDIT_*'
      - 'tests/test_wave_scale_state_conditional_calibration_v4*.py'
      - '.github/workflows/wave-scale-state-conditional-calibration-v4-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -r executor/requirements.txt
      - run: python3 -m unittest tests.test_wave_scale_state_conditional_calibration_v4 tests.test_wave_scale_state_conditional_calibration_v4_source -v
