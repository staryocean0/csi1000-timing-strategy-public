name: Two-Wave segmentation carrier qualification tests
on:
  pull_request:
    branches: [cloud-workspace-v1]
    paths:
      - '.github/workflows/wave-segmentation-carrier-qualification-tests.yml'
      - '.github/workflows/public-compute.yml'
      - '.github/workflows/controller-dispatch.yml'
      - 'executor/wave_segmentation_carrier_*'
      - 'tests/segmentation_carrier_registration_support.py'
      - 'tests/test_wave_segmentation_carrier*.py'
      - 'docs/research/TWO_WAVE_SEGMENTATION_CARRIER_QUALIFICATION*'
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -r executor/requirements.txt
      - name: Synthetic carrier and route contracts only
        run: |
          python3 - <<'PY'
          import sys,unittest
          suite=unittest.defaultTestLoader.discover('tests',pattern='test_wave_segmentation_carrier*.py')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          print(f'run={result.testsRun} skipped={len(result.skipped)}')
          sys.exit(0 if result.wasSuccessful() and not result.skipped and result.testsRun >= 35 else 1)
          PY
