name: Temporary Native60B control-plane patch

on:
  push:
    branches:
      - feat/risk-v3-native60-phase60b-volatility-continuity-map-20260916

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'staryocean0/csi1000-timing-strategy-public'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/risk-v3-native60-phase60b-volatility-continuity-map-20260916
          fetch-depth: 0
      - name: Apply exact bounded patch
        shell: python
        run: |
          from pathlib import Path
          profile = "risk-v3-native60-phase60b-volatility-continuity-map-v1"
          broker = "risk_v3_native60_phase60b_volatility_continuity_map_broker.py"
          mirror = "risk_v3_native60_phase60b_volatility_continuity_map_private_mirror.py"

          wf = Path('.github/workflows/public-compute.yml')
          s = wf.read_text()
          anchor = "          - risk-v3-native60-phase60a-canonical-carrier-v1\n"
          assert s.count(anchor) == 1
          s = s.replace(anchor, anchor + f"          - {profile}\n", 1)
          assert profile not in s[s.index('name: CSI1000 standard public executor'):s.index('jobs:')].replace(f"          - {profile}\n", '')
          job = f'''\n  execute_native60b:\n    if: >-\n      github.repository == 'staryocean0/csi1000-timing-strategy-public' &&\n      github.event.repository.private == false &&\n      github.ref == 'refs/heads/cloud-workspace-v1' &&\n      github.event_name == 'workflow_dispatch' &&\n      inputs.profile == '{profile}'\n    runs-on: ubuntu-24.04\n    environment: private-research\n    timeout-minutes: 40\n    steps:\n      - name: Checkout reviewed public executor only\n        timeout-minutes: 3\n        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262\n        with:\n          persist-credentials: false\n          sparse-checkout: |\n            executor\n            tests\n            docs/research\n            .github/workflows\n          sparse-checkout-cone-mode: true\n      - name: Synthetic executor tests\n        timeout-minutes: 2\n        run: python3 -m unittest discover -s tests -p 'test_*.py' -v\n      - name: Build public runtime before private credentials or data\n        timeout-minutes: 8\n        run: docker build --tag factorlab-runtime:local executor\n      - name: Prove isolated runtime with no private data\n        timeout-minutes: 2\n        run: python3 executor/broker.py runtime-smoke\n      - name: Prepare fixed private inputs\n        id: prepare60b\n        timeout-minutes: 6\n        env:\n          FACTORLAB_PRIVATE_TOKEN: ${{{{ secrets.FACTORLAB_PRIVATE_TOKEN }}}}\n        run: python3 executor/{broker} prepare {profile}\n      - name: Compute without private credentials\n        id: compute60b\n        timeout-minutes: 25\n        run: python3 executor/{broker} compute {profile}\n      - name: Stop owned container before credentials return\n        id: cleanup60b\n        if: always() && steps.prepare60b.outcome == 'success'\n        timeout-minutes: 1\n        run: python3 executor/{broker} cleanup {profile}\n      - name: Return verified results privately\n        if: always() && steps.prepare60b.outcome == 'success' && steps.cleanup60b.outcome == 'success'\n        timeout-minutes: 6\n        env:\n          FACTORLAB_PRIVATE_TOKEN: ${{{{ secrets.FACTORLAB_PRIVATE_TOKEN }}}}\n        run: |\n          python3 executor/{broker} publish {profile}\n          python3 executor/{mirror}\n'''
          assert '  execute_native60b:' not in s
          s = s.rstrip() + job
          wf.write_text(s)

          ctrl = Path('.github/workflows/controller-dispatch.yml')
          c = ctrl.read_text()
          title_a = "       github.event.issue.title == 'controller: risk-v3-native60-phase60a-canonical-carrier-v1' ||\n"
          assert c.count(title_a) == 1
          c = c.replace(title_a, title_a + f"       github.event.issue.title == 'controller: {profile}' ||\n", 1)
          case_a = "            'controller: risk-v3-native60-phase60a-canonical-carrier-v1')\n              profile='risk-v3-native60-phase60a-canonical-carrier-v1'\n              ;;\n"
          assert c.count(case_a) == 1
          c = c.replace(case_a, case_a + f"            'controller: {profile}')\n              profile='{profile}'\n              ;;\n", 1)
          ctrl.write_text(c)
      - name: Verify bounded diff and contract test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_risk_v3_native60_phase60b_prereg tests.test_risk_v3_native60_phase60b_volatility_continuity_map -v
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/controller-dispatch.yml' '.github/workflows/public-compute.yml' | sort)"
          test "$changed" = "$expected"
          grep -F "risk-v3-native60-phase60b-volatility-continuity-map-v1" .github/workflows/public-compute.yml >/dev/null
          grep -F "controller: risk-v3-native60-phase60b-volatility-continuity-map-v1" .github/workflows/controller-dispatch.yml >/dev/null
      - name: Commit bounded patch and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-temp-native60b-control-plane-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/public-compute.yml .github/workflows/controller-dispatch.yml .github/workflows/zz-temp-native60b-control-plane-patch.yml
          git commit -m 'Wire Native-60m Phase 60-B standard control plane'
          git push origin HEAD:feat/risk-v3-native60-phase60b-volatility-continuity-map-20260916
