name: Temporary Native60B shared-phase patch

on:
  push:
    branches:
      - feat/risk-v3-native60-phase60b-volatility-continuity-map-20260916

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'staryocean0/csi1000-timing-strategy-public'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/risk-v3-native60-phase60b-volatility-continuity-map-20260916
          fetch-depth: 0
      - name: Move Native60B into existing four-phase standard path
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/public-compute.yml')
          s=p.read_text()
          profile='risk-v3-native60-phase60b-volatility-continuity-map-v1'
          broker='risk_v3_native60_phase60b_volatility_continuity_map_broker.py'
          mirror='risk_v3_native60_phase60b_volatility_continuity_map_private_mirror.py'

          marker='\n  execute_native60b:\n'
          assert s.count(marker)==1
          s=s.split(marker,1)[0].rstrip()+'\n'

          old="inputs.profile == 'risk-v3-native60-phase60a-canonical-carrier-v1' || inputs.profile == 'risk-v3-native15-c1-gate-attribution-v1'"
          new="inputs.profile == 'risk-v3-native60-phase60a-canonical-carrier-v1' || inputs.profile == 'risk-v3-native60-phase60b-volatility-continuity-map-v1' || inputs.profile == 'risk-v3-native15-c1-gate-attribution-v1'"
          assert s.count(old)==2
          s=s.replace(old,new)

          def insert_after(anchor, extra, count=1):
              global s
              assert s.count(anchor)==count, (anchor, s.count(anchor))
              s=s.replace(anchor,anchor+extra,count)

          insert_after(
            "          elif [ '${{ inputs.profile }}' = 'risk-v3-native60-phase60a-canonical-carrier-v1' ]; then\n            python3 executor/risk_v3_native60_phase60a_broker.py prepare risk-v3-native60-phase60a-canonical-carrier-v1\n",
            "          elif [ '${{ inputs.profile }}' = 'risk-v3-native60-phase60b-volatility-continuity-map-v1' ]; then\n            python3 executor/"+broker+" prepare "+profile+"\n")
          insert_after(
            "          elif [ '${{ inputs.profile }}' = 'risk-v3-native60-phase60a-canonical-carrier-v1' ]; then\n            python3 executor/risk_v3_native60_phase60a_broker.py compute risk-v3-native60-phase60a-canonical-carrier-v1\n",
            "          elif [ '${{ inputs.profile }}' = 'risk-v3-native60-phase60b-volatility-continuity-map-v1' ]; then\n            python3 executor/"+broker+" compute "+profile+"\n")
          insert_after(
            "          elif [ '${{ inputs.profile }}' = 'risk-v3-native60-phase60a-canonical-carrier-v1' ]; then\n            python3 executor/risk_v3_native60_phase60a_broker.py cleanup risk-v3-native60-phase60a-canonical-carrier-v1\n",
            "          elif [ '${{ inputs.profile }}' = 'risk-v3-native60-phase60b-volatility-continuity-map-v1' ]; then\n            python3 executor/"+broker+" cleanup "+profile+"\n")
          insert_after(
            "          elif [ '${{ inputs.profile }}' = 'risk-v3-native60-phase60a-canonical-carrier-v1' ]; then\n            python3 executor/risk_v3_native60_phase60a_broker.py publish risk-v3-native60-phase60a-canonical-carrier-v1\n            python3 executor/risk_v3_native60_phase60a_private_mirror.py\n",
            "          elif [ '${{ inputs.profile }}' = 'risk-v3-native60-phase60b-volatility-continuity-map-v1' ]; then\n            python3 executor/"+broker+" publish "+profile+"\n            python3 executor/"+mirror+"\n")

          assert s.count('secrets.FACTORLAB_PRIVATE_TOKEN')==2
          assert s.count("python3 executor/"+broker+" prepare "+profile)==1
          assert s.count("python3 executor/"+broker+" compute "+profile)==1
          assert s.count("python3 executor/"+broker+" cleanup "+profile)==1
          assert s.count("python3 executor/"+broker+" publish "+profile)==1
          assert s.count("python3 executor/"+mirror)==1
          p.write_text(s)
      - name: Run full repository contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r executor/requirements.txt
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          changed="$(git diff --name-only | sort)"
          test "$changed" = '.github/workflows/public-compute.yml'
      - name: Commit verified patch and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-temp-native60b-shared-phase-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/public-compute.yml .github/workflows/zz-temp-native60b-shared-phase-patch.yml
          git commit -m 'Reuse standard four-phase secret surface for Native-60m Phase 60-B'
          git push origin HEAD:feat/risk-v3-native60-phase60b-volatility-continuity-map-20260916
